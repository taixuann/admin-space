# bots/models.yaml
# Approved models and aliases. Only Tai edits this file.
# Holds categories only: no endpoints, API modes or keys.
# A bot names an alias in its config.json, as a dotted path: `reasoning.high`.
# Each model listed under a provider is used by at least one alias.
# `effort` is omitted when the alias sets none.
# Tiers are fixed: high, standard, light, free. Never add a tier. To change a model, edit the model or effort of an existing tier.

providers:
  anthropic:
    type: subscription
    models:
      - claude-opus-5-5
      - claude-sonnet-5-5
      - claude-haiku-5-5
  opencode-go:
    type: subscription          # confirm: flat plan with monthly cap
    models:
      - beam-free

aliases:
  reasoning:
    high:     { model: claude-opus-5-5,   effort: high }
    standard: { model: claude-sonnet-5-5, effort: high }
    free:     { model: beam-free }
  coding:
    high:     { model: claude-opus-5-5,   effort: medium }
    standard: { model: claude-sonnet-5-5, effort: medium }
    free:     { model: beam-free }
  operation:
    high:     { model: claude-haiku-5-5,  effort: high }
    standard: { model: claude-haiku-5-5,  effort: medium }
    light:    { model: claude-haiku-5-5,  effort: low }
    free:     null
  general:
    high:     { model: claude-opus-5-5 }
    standard: { model: claude-sonnet-5-5 }
    free:     { model: beam-free }
