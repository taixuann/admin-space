# bots/plugins.yaml
# Catalog of plugins, MCP servers and memory providers seen in Hermes. Reference only.
# Tai approves what a bot enables. Ask Tai before changing any of them.
# Facts come from `hermes plugins list`, plugin.yaml files and `hermes memory --help`.
# Verified 2026-10-26 on profile harvey. Entries not listed here were not checked.

plugins:
  standalone:
    bot-forge:        Builds a complete Bot from "make me a <role>" (SOUL, memory, tools, skills, gateway); rolls back on failure.
    quota:            Per-provider quota and rate-limit status through /quota and a desktop widget.
    superpowers:      Skills library (brainstorming, TDD, debugging, plans). Skills appear as superpowers:<name>.
    caveman_native:   Native lifecycle bridge.
    caveman_shrink:   Routes oversized terminal output through caveman shrink.
    security-guidance: Adds security warnings to file-write results. Non-blocking.
    disk-cleanup:     Tracks and cleans ephemeral files made during sessions.
    memory-wiki:      Dashboard tab of subject pages and daily logs from local sessions; read-only audit of MEMORY.md and USER.md.
  model-provider:
    antigravity-oauth: Runs Hermes on a Google Antigravity plan through the agy CLI.
  groups:   # many plugins, one purpose; names are in `hermes plugins list`
    "browser-*":   cloud browser backends (browser-use, browserbase, firecrawl)
    "web-*":       web search backends
    "*-platform":  messaging platform adapters (discord, telegram, slack, and others)
    image/video: media generation providers
  memory:   # exclusive plugins; see the memory section

memory:
  rule: Built-in memory (MEMORY.md and USER.md) is always active. Only one external provider is active at a time. Switch with `hermes memory setup`; `hermes memory off` returns to built-in only.
  built-in: always on
  external:
    mnemosyne:  Local SQLite memory with vector search, FTS5 ranking and temporal triples. No cloud. Exclusive plugin.
    hindsight:  Long-term memory with knowledge graph and entity resolution. Installed as a plugin; config key `memory.hindsight`.
    bundled-in-hermes: [retaindb, byterover, holographic, mem0, openviking]
    catalog: [honcho, supermemory]   # install with `hermes plugins install <name>`
  in_use:
    harvey: mnemosyne

mcps:   # servers are listed per profile with `hermes -p <name> mcp list`
  seen_on_harvey: [caveman-native, decision-engine, linear]   # disabled
  notion: enabled on harvey 2026-10-26 (config set); OAuth login for harvey still needed
