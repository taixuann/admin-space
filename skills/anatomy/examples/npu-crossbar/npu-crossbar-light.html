<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Full-Stack Neuromorphic NPU</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;

  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;

}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(940px,100% - 32px);margin:64px auto 96px}
</style></head><body class="iso" data-theme="light"><main class="iso-page"><style>.npu {
  --npu-blend: screen;
  --npu-button-hover: #232323;
  --npu-button-ring: #ffffff14;
  --npu-part-ring: #ffffff10;
  --npu-part-hover: #ffffff0a;
  --npu-lamp-off: #4a4a4a;
  --npu-lamp-on: #ff8a3c;
  --npu-lamp-glow: #ff7a2a88;
  --npu-lamp-armed: #ffcf6a;
  --npu-cf-core: #ffb46e;
  --npu-cf-halo: #ff7a2a;
  --npu-screen-bg: #111315;
  --npu-screen-fg: #e5e5e0;
}

[data-theme="light"] .npu {
  --npu-blend: normal;
  --npu-button-hover: #f0f0ed;
  --npu-button-ring: #0000001a;
  --npu-part-ring: #00000014;
  --npu-part-hover: #0000000a;
  --npu-lamp-off: #c4c4c4;
  --npu-lamp-on: #d9480f;
  --npu-lamp-glow: #d9480f55;
  --npu-lamp-armed: #c99400;
  --npu-cf-core: #c2410c;
  --npu-cf-halo: #ea580c;
  --npu-screen-bg: #d8d6d0;
  --npu-screen-fg: #181816;
}

.npu .iso-plate {
  padding: 52px 24px 64px;
  overflow: hidden;
}

.npu-stage {
  position: relative;
  border-radius: 10px;
  touch-action: pan-y;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select-none: none;
  will-change: transform;
}

.npu-stage:focus-visible {
  outline: 1px solid var(--anatomy-muted);
  outline-offset: 6px;
}

.npu-stage > svg {
  display: block;
  width: 100%;
  height: auto;
}

.npu-front {
  position: absolute;
  inset: 0;
  height: 100% !important;
  pointer-events: none;
  overflow: visible;
}

.npu-front .it {
  pointer-events: visiblePainted;
  cursor: pointer;
}

.npu-stage[data-focus] .it:not([data-on]):not([data-piece="stand"]) {
  --anatomy-hi: var(--anatomy-mid);
  --anatomy-mid: var(--anatomy-lo);
}

.npu-stage[data-focus] .it[data-piece="stand"] {
  --anatomy-mid: var(--anatomy-lo);
}

.it[data-on] {
  --anatomy-hi: var(--anatomy-lit);
  --anatomy-mid: var(--anatomy-hi);
}

.it[data-on] .iso-top {
  fill: var(--anatomy-lit-top);
}

.it[data-on] .iso-shade {
  fill: var(--anatomy-lit-shade);
}

.it[data-on] [data-seamless] > .iso-shade {
  stroke: var(--anatomy-lit-shade);
}

.it[data-on] [data-seamless] > .iso-top {
  stroke: var(--anatomy-lit-top);
}

.npu-cf-glow {
  fill: none;
  stroke: var(--npu-cf-core);
  stroke-width: 1.8;
  stroke-linecap: round;
  opacity: var(--cf-glow, 0);
  pointer-events: none;
}

.iso-svg .npu-cf-soft {
  stroke: var(--npu-cf-halo);
  stroke-width: 6;
  vector-effect: none;
  filter: blur(3px);
  opacity: calc(var(--cf-glow, 0) * 0.45);
}

.npu-screen-rect {
  fill: var(--npu-screen-bg);
  stroke: var(--anatomy-lo);
  stroke-width: 0.6;
}

.npu-screen-text {
  fill: var(--npu-screen-fg);
  font-family: var(--anatomy-mono);
  font-weight: 600;
  letter-spacing: 0.04em;
}

.npu-controls {
  position: absolute;
  left: 20px;
  bottom: 16px;
  display: flex;
  align-items: center;
  gap: 14px;
  font-family: var(--anatomy-mono);
  font-size: 10.5px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--anatomy-muted);
}

.npu-pulse {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  height: 28px;
  padding: 0 13px 0 11px;
  border: 0;
  border-radius: 999px;
  background: var(--anatomy-face);
  color: var(--anatomy-strong);
  font: inherit;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  cursor: pointer;
  box-shadow: inset 0 0 0 1px var(--npu-button-ring);
  transition: background 200ms var(--anatomy-ease), color 200ms var(--anatomy-ease), transform 160ms var(--anatomy-ease);
}

.npu-pulse:hover {
  background: var(--npu-button-hover);
}

.npu-pulse:active {
  transform: scale(0.97);
}

.npu-pulse:focus-visible {
  outline: 1px solid var(--anatomy-muted);
  outline-offset: 3px;
}

.npu-lamp {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--npu-lamp-off);
  box-shadow: 0 0 0 0 transparent;
  transition: background 240ms var(--anatomy-ease), box-shadow 240ms var(--anatomy-ease);
}

.npu-pulse[data-state="on"] .npu-lamp {
  background: var(--npu-lamp-on);
  box-shadow: 0 0 10px 2px var(--npu-lamp-glow);
}

.npu-pulse[data-state="armed"] .npu-lamp {
  background: var(--npu-lamp-armed);
  box-shadow: 0 0 8px 1px var(--npu-lamp-glow);
}

.npu-parts {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 8px;
}

.npu-part {
  display: inline-flex;
  align-items: baseline;
  gap: 7px;
  padding: 5px 10px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: var(--anatomy-muted);
  font: 12.5px/1.3 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  cursor: pointer;
  box-shadow: inset 0 0 0 1px var(--npu-part-ring);
  transition: color 160ms var(--anatomy-ease), background 160ms var(--anatomy-ease);
}

.npu-part:hover,
.npu-part:focus-visible,
.npu-part[data-on] {
  color: var(--anatomy-strong);
  background: var(--npu-part-hover);
  outline: none;
}

.npu-num {
  font-family: var(--anatomy-mono);
  font-size: 10px;
  color: var(--anatomy-muted);
}

.npu-live {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}

@media (max-width: 640px) {
  .npu .iso-plate {
    padding: 48px 8px 88px;
  }

  .npu .iso-plate-corner[data-corner="readout"] {
    bottom: 46px;
    right: 0;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .npu-stage[data-focus] ~ .npu-controls .npu-hint {
    visibility: hidden;
  }

  .npu-controls {
    left: 14px;
    bottom: 14px;
    gap: 10px;
    max-width: calc(100% - 28px);
    flex-wrap: wrap;
  }

  .npu-hint {
    font-size: 9.5px;
    letter-spacing: 0.06em;
    line-height: 1.3;
  }
}

@media (prefers-reduced-motion: reduce) {
  .npu * {
    transition: none !important;
  }
}

const STAGGER = D.stagger;
const SPRING = D.spring;
const piece = Object.fromEntries(IDS.map((id) => [id, { x: 0, v: 0, target: 0, pending: null }]));
const clamp = (value, low, high) => Math.min(high, Math.max(low, value));

let clock = 0;
let apart = false;
let selected = null;
let inside = false;
let leaveTimer = 0;
let touring = !still.matches;
let tourClock = -0.4;
let idleTimer = 0;
let visible = false;
let frame = 0;
let last = 0;

const pulse = {
  on: false,
  armed: false,
  tour: false,
  t: -1,
  stopAt: 5.8,
  stopping: -1,
  level: 0,
  rate: 0,
  phase: "",
};

function say(text) {
  if (readout.textContent !== text) readout.textContent = text;
}

function announce(phase) {
  if (pulse.phase === phase) return;
  pulse.phase = phase;
  if (live) live.textContent = phase;
}

function describe() {
  const text = selected
    ? D.pieces[selected].say
    : pulse.on
      ? "Executing analog VMM pulse"
      : apart
        ? "Exploded · 8 full-stack assemblies"
        : "Assembled · standby · 18 µS HRS";
  if (stage.getAttribute("aria-valuetext") !== text) stage.setAttribute("aria-valuetext", text);
}

function setApart(on) {
  if (apart === on) return;
  apart = on;
  const goal = on ? 1 : 0;
  let index = 0;
  for (const id of on ? STAGGER : [...STAGGER].reverse()) {
    if (!piece[id]) continue;
    if (piece[id].target === goal) piece[id].pending = null;
    else piece[id].pending = { value: goal, at: clock + (still.matches ? 0 : index++ * SPRING.stagger) };
  }
  describe();
  run();
}

function select(id) {
  if (id === "stand") id = null;
  if (selected === id) return;
  selected = id;
  for (const node of nodes) {
    if (id !== null && node.piece === id) node.el.setAttribute("data-on", "");
    else node.el.removeAttribute("data-on");
  }
  if (id) stage.setAttribute("data-focus", "");
  else stage.removeAttribute("data-focus");
  partButtons.forEach((button) =>
    button.dataset.part === id ? button.setAttribute("data-on", "") : button.removeAttribute("data-on"),
  );
  stage.setAttribute("aria-valuenow", String(id ? D.order.indexOf(id) + 1 : 0));
  describe();
}

function steerSpring(state, dt, calm) {
  if (state.pending && clock >= state.pending.at) {
    state.target = state.pending.value;
    state.pending = null;
  }
  if (calm) {
    state.x = state.target;
    state.v = 0;
    return false;
  }
  for (let index = 0; index < SPRING.substeps; index++) {
    const h = dt / SPRING.substeps;
    state.v += ((state.target - state.x) * SPRING.stiffness - state.v * SPRING.damping) * h;
    state.x += state.v * h;
  }
  if (Math.abs(state.target - state.x) < 2e-4 && Math.abs(state.v) < 2e-4) {
    state.x = state.target;
    state.v = 0;
    return state.pending !== null;
  }
  return true;
}

function needlePath(colIndex, share) {
  const cx = D.meters[colIndex][0];
  const cy = D.meters[colIndex][1];
  const cz = D.meterTop;
  const r = D.meterR - 2.4;
  const targetRatio = D.colCurrents[colIndex] / 22.0;
  const ratio = 0.12 + share * targetRatio;
  const angle = (ratio - 0.5) * 1.45;
  const x0 = cx - Math.sin(angle) * 1.8;
  const y0 = cy + Math.cos(angle) * 1.8;
  const x1 = cx + Math.sin(angle) * r;
  const y1 = cy - Math.cos(angle) * r;
  return lineOnTop([x0, y0], [x1, y1], cz + 0.25, D.P);
}

function place() {
  for (const node of nodes) {
    const share = piece[node.ride].x;
    const tx = (D.EX[0] * node.m[0] + D.EY[0] * node.m[1] + D.EZ[0] * node.m[2]) * share;
    const ty = (D.EX[1] * node.m[0] + D.EY[1] * node.m[1] + D.EZ[1] * node.m[2]) * share;
    const text = share === 0 ? "" : `translate(${tx.toFixed(2)} ${ty.toFixed(2)})`;
    if (text !== node.shown) {
      node.shown = text;
      if (text) node.el.setAttribute("transform", text);
      else node.el.removeAttribute("transform");
    }
  }
  const next = nodes
    .map((_, index) => index)
    .sort(
      (a, b) =>
        nodes[a].key +
        nodes[a].lift * piece[nodes[a].ride].x -
        (nodes[b].key + nodes[b].lift * piece[nodes[b].ride].x),
    );
  if (next.some((index, at) => index !== order[at])) {
    const fragment = document.createDocumentFragment();
    for (const index of next) fragment.appendChild(nodes[index].el);
    rig.appendChild(fragment);
    order = next;
  }
}

function pulseState(state) {
  if (state) pulseButton.dataset.state = state;
  else delete pulseButton.dataset.state;
}

function startPulse(fromTour = false) {
  if (pulse.on) return;
  setApart(false);
  select(null);
  pulse.on = true;
  pulse.armed = true;
  pulse.tour = fromTour;
  pulse.t = 0;
  pulse.stopping = -1;
  pulse.stopAt = fromTour ? 4.8 : 6.2;
  pulseState("armed");
  pulseLabel.textContent = "Reset";
  describe();
  run();
}

function stopPulse() {
  if (!pulse.on || pulse.stopping >= 0) return;
  pulse.stopping = pulse.t;
}

function stepPulse(dt, calm) {
  if (pulse.on && pulse.armed && IDS.every((id) => piece[id].x < 0.002 && !piece[id].pending)) {
    pulse.armed = false;
    pulseState("on");
    if (calm) pulse.t = 2.6;
  }
  if (pulse.on && !pulse.armed) pulse.t += dt;
  const t = pulse.t;
  if (pulse.on && pulse.stopping < 0 && t >= pulse.stopAt) pulse.stopping = t;

  const activeTarget = !pulse.on || pulse.armed || pulse.stopping >= 0 ? 0 : t < 0.7 ? 0.35 : 1;
  if (calm) {
    pulse.level = activeTarget;
    pulse.rate = 0;
  } else {
    const stiff = pulse.stopping >= 0 ? 18 : 36;
    const drag = 2 * Math.sqrt(stiff);
    for (let i = 0; i < 4; i++) {
      const h = dt / 4;
      pulse.rate += ((activeTarget - pulse.level) * stiff - pulse.rate * drag) * h;
      pulse.level = clamp(pulse.level + pulse.rate * h, 0, 1);
    }
  }

  for (let i = 0; i < 4; i++) {
    if (needles[i]) needles[i].setAttribute("d", needlePath(i, pulse.level));
  }
  stage.style.setProperty("--cf-glow", pulse.level.toFixed(3));

  if (screenText) {
    const hex = pulse.level > 0.65 ? "0x7A · 38.4T" : pulse.level > 0.2 ? "SET · 142uS" : "IDLE · 18uS";
    if (screenText.textContent !== hex) screenText.textContent = hex;
  }

  if (pulse.on) {
    const gVal = Math.round(18 + pulse.level * 124);
    const iSum = (2.2 + pulse.level * 16.2).toFixed(1);
    if (pulse.armed) {
      say("closing stack · arming pulse");
      announce("arming");
    } else if (pulse.stopping >= 0) {
      say(`resetting · G = ${gVal} µS · relaxing`);
      announce("reset");
    } else if (t < 0.8) {
      say("01–02 · DAC wordline encode · V = [1.8, 1.2, 0.8, 1.5] V");
      announce("wordline encode");
    } else if (t < 2.0) {
      say(`04–05 · SET filament bridging · E = 12 MV/m · G = ${gVal} µS`);
      announce("conductive filament potentiation");
    } else if (t < 3.6) {
      say(`03 & 07 · Kirchhoff VMM · ΣI_col0 = ${iSum} mA`);
      announce("analog vector-matrix multiply");
    } else {
      say(`08 · 8-bit SAR-ADC + Shift-Add · 0x7A · 38.4 TOPS/W`);
      announce("digital tensor latched");
    }
  }

  if (pulse.on && pulse.stopping >= 0 && pulse.level < 0.004 && Math.abs(pulse.rate) < 0.01) {
    pulse.on = false;
    pulse.t = -1;
    pulse.level = 0;
    pulse.rate = 0;
    pulseState("");
    pulseLabel.textContent = "Pulse VMM";
    announce("standby");
    describe();
    if (pulse.tour) tourClock = -0.4;
  }

  return pulse.on || pulse.level > 0.002;
}

const TOUR_STEP = 1.45;
function tourAt(time) {
  const apartFrom = 0.5;
  const listFrom = apartFrom + 0.8;
  const listTo = listFrom + D.order.length * TOUR_STEP;
  const fireAt = listTo + 1.1;
  if (time < apartFrom) return { apart: false, part: null, fire: false };
  if (time < listFrom) return { apart: true, part: null, fire: false };
  if (time < listTo) return { apart: true, part: D.order[Math.floor((time - listFrom) / TOUR_STEP)], fire: false };
  if (time < fireAt) return { apart: false, part: null, fire: false };
  return { apart: false, part: null, fire: true };
}

function quietTour() {
  touring = false;
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => {
    if (inside || pulse.on) return quietTour();
    touring = !still.matches;
    tourClock = -0.4;
    run();
  }, 3800);
}

function idleText() {
  if (selected) return D.pieces[selected].say;
  const moving = IDS.some((id) => Math.abs(piece[id].x - piece[id].target) > 0.002 || piece[id].pending);
  if (moving) return apart ? "exploding stack" : "closing stack";
  return apart ? "exploded · 8 full-stack layers" : "4×4 differential NPU · 18 µS HRS · standby";
}

function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now;
  clock += dt;
  const calm = still.matches;
  if (touring && !pulse.on) {
    tourClock += dt;
    const step = tourAt(tourClock);
    setApart(step.apart);
    select(step.part);
    if (step.fire) startPulse(true);
  }
  let moving = false;
  for (const id of IDS) if (steerSpring(piece[id], dt, calm)) moving = true;
  const pulsing = stepPulse(dt, calm);
  place();
  if (!pulse.on) say(idleText());
  frame = visible && (moving || pulsing || touring) ? requestAnimationFrame(tick) : 0;
}

function run() {
  if (!frame && visible) {
    last = 0;
    frame = requestAnimationFrame(tick);
  }
}

new IntersectionObserver(
  (entries) => {
    visible = entries[entries.length - 1].isIntersecting;
    if (visible) run();
  },
  { rootMargin: "120px 0px" },
).observe(stage);

function pieceAt(event) {
  const hit = document.elementFromPoint(event.clientX, event.clientY);
  const item = hit && hit.closest ? hit.closest(".it") : null;
  return item ? item.dataset.piece : null;
}

stage.addEventListener("pointermove", (event) => {
  if (event.pointerType === "touch") return;
  inside = true;
  clearTimeout(leaveTimer);
  quietTour();
  if (pulse.on) return;
  setApart(true);
  select(pieceAt(event));
  run();
});

stage.addEventListener("pointerleave", () => {
  inside = false;
  clearTimeout(leaveTimer);
  leaveTimer = setTimeout(() => {
    if (inside) return;
    select(null);
    setApart(false);
  }, 260);
});

stage.addEventListener("pointerdown", (event) => {
  if (event.pointerType !== "touch" || pulse.on) return;
  quietTour();
  const id = pieceAt(event);
  if (!id || id === "stand") {
    select(null);
    setApart(!apart);
  } else {
    setApart(true);
    select(id);
  }
  run();
});

pulseButton.addEventListener("click", () => {
  quietTour();
  if (pulse.on) stopPulse();
  else startPulse(false);
  run();
});

partButtons.forEach((button) => {
  const show = () => {
    if (pulse.on) return;
    quietTour();
    clearTimeout(leaveTimer);
    setApart(true);
    select(button.dataset.part);
    run();
  };
  const hide = () => {
    clearTimeout(leaveTimer);
    leaveTimer = setTimeout(() => {
      if (inside || partButtons.some((other) => other.matches(":hover, :focus-visible"))) return;
      select(null);
      setApart(false);
    }, 260);
  };
  button.addEventListener("pointerenter", show);
  button.addEventListener("focus", show);
  button.addEventListener("pointerleave", hide);
  button.addEventListener("blur", hide);
  button.addEventListener("click", show);
});

stage.addEventListener("keydown", (event) => {
  const index = selected ? D.order.indexOf(selected) : -1;
  let next = null;
  if (event.key === "ArrowRight" || event.key === "ArrowDown") next = Math.min(D.order.length - 1, index + 1);
  else if (event.key === "ArrowLeft" || event.key === "ArrowUp") next = Math.max(0, index - 1);
  else if (event.key === "Home") next = 0;
  else if (event.key === "End") next = D.order.length - 1;
  else if (event.key === "Escape") {
    event.preventDefault();
    quietTour();
    if (pulse.on) stopPulse();
    select(null);
    setApart(false);
    run();
    return;
  } else if (event.key === "p" || event.key === "P" || event.key === "Enter") {
    event.preventDefault();
    quietTour();
    if (pulse.on) stopPulse();
    else startPulse(false);
    run();
    return;
  } else if (event.key === " ") {
    event.preventDefault();
    quietTour();
    if (!pulse.on) setApart(!apart);
    if (!apart) select(null);
    run();
    return;
  }
  if (next === null || pulse.on) return;
  event.preventDefault();
  quietTour();
  setApart(true);
  select(D.order[next]);
  run();
});

if (still.matches) touring = false;
place();
for (let i = 0; i < 4; i++) {
  if (needles[i]) needles[i].setAttribute("d", needlePath(i, 0));
}
</script></body></html>
