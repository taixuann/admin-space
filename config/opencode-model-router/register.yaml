version: 3
updated_at: '2026-10-25T17:47:39.399653+07:00'
tools:
- id: hindsight_global
  name: Hindsight Global LLM Environment
  type: dotenv
  path: ~/.hindsight/profiles/coding-agent.env
  field: HINDSIGHT_API_LLM_MODEL
  profile: free_only
  mode: single_active
  description: Global coding-agent LLM model configuration for Hindsight (single active
    model)
  enabled: true
automation:
- id: model_control_sync
  name: Model Control Sync Scheduled Job
  type: schedule_job
  path: automation/model-sync/launchd.plist
  mode: automation
  description: Multi-space 2-tier fallback synchronizer launchd daemon
  enabled: true
agents:
- id: opencode_global
  name: OpenCode Global Configuration
  type: opencode
  path: ~/.config/opencode/opencode.jsonc
  profile: overall
  mode: two_tier_chain
  description: Global admin workspace configuration for OpenCode with 2-tier fallback
    chain
  enabled: true
- id: opencode_development
  name: OpenCode Development Space
  type: opencode
  path: ~/development-space/.opencode/opencode.json
  profile: coding
  mode: two_tier_chain
  description: Development space workspace configuration with 2-tier fallback chain
  enabled: true
- id: opencode_academic
  name: OpenCode Academic Space
  type: opencode
  path: ~/academic-space/.opencode/opencode.json
  profile: reasoning
  mode: two_tier_chain
  description: Academic space workspace configuration with 2-tier fallback chain
  enabled: true
- id: hermes_forge
  name: Hermes forge profile
  type: hermes_yaml
  path: ~/.hermes/profiles/forge/config.yaml
  profile: coding
  mode: two_tier_chain
  enabled: true
- id: hermes_asura
  name: Hermes asura profile
  type: hermes_yaml
  path: ~/.hermes/profiles/asura/config.yaml
  profile: coding
  mode: two_tier_chain
  enabled: true
- id: hermes_executor
  name: Hermes executor profile
  type: hermes_yaml
  path: ~/.hermes/profiles/executor/config.yaml
  profile: coding
  mode: two_tier_chain
  enabled: true
