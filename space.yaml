# ==============================================================================
# GLOBAL SPACE MANIFEST & ECOSYSTEM TOPOLOGY
# Single Source of Truth for Space roles, boundaries, and tool distribution.
# Location: ~/.agents/space.yaml (Admin Space exclusive)
# ==============================================================================

version: "1.0"
updated_at: "2026-10-24"
ecosystem_name: "Tai's Multi-Agent Ecosystem"

# ------------------------------------------------------------------------------
# 1. SPACES DIRECTORY & BOUNDARIES
# ------------------------------------------------------------------------------
spaces:
  admin:
    name: "Admin Space"
    path: "/Users/tai/.agents"
    role: "Control Plane & Orchestrator"
    description: "Maintains its own agent environment and coordinates workflows, memory, and policy across Spaces."
    responsibilities:
      - "Global memory coordination (Hindsight bank: admin)"
      - "Task orchestration & Notion Agents Ticket database sync"
      - "Global scheduled launchd automations (~/.agents/automation/)"
      - "Global skills repository & mirror source (~/.agents/skills/)"
      - "System-wide operating principles and identity (SOUL.md, USER.md)"
    boundaries:
      - "Holds no product source code and no raw scientific experimental data."
      - "Tools development belongs strictly to Development Space."
    entrypoints:
      codex: "AGENTS.md"
      claude: "CLAUDE.md"
      gemini: "GEMINI.md"

  development:
    name: "Development Space"
    path: "/Users/tai/development-space"
    role: "Internal Tool Factory & Software Workshop"
    description: "Central software platform and canonical repository host for all internal tools."
    responsibilities:
      - "Canonical source for all internal tools (tools/<space>/<tool-name>/)"
      - "Centralized ephemeral task worktrees (worktrees/)"
      - "Engineering discipline (TDD, Superpowers, Codebase Design, Release Gates)"
      - "Packaging & distribution of CLI tools (uv tool / binaries to ~/.local/bin)"
    boundaries:
      - "Holds no personal notes, no private records, and no raw scientific data."
    entrypoints:
      codex: "AGENTS.md"
      claude: "CLAUDE.md"

  research:
    name: "Research Space"
    path: "/Users/tai/research-projects"
    role: "Scientific Research Lab"
    description: "Scientific investigation, empirical data analysis, and manuscript preparation."
    responsibilities:
      - "Raw instrument measurements and sensor data (strictly immutable)"
      - "Data extraction pipelines, scientific visualization, analysis notebooks"
      - "Paper manuscripts, figures, and publication artifacts"
    boundaries:
      - "Does not develop platform tools locally; requests tools from Development Space."

  study:
    name: "Study Space"
    path: "/Users/tai/learn"
    role: "Study & Knowledge Synthesis"
    description: "Structured learning, literature reading, and conceptual study."
    responsibilities:
      - "Reading notes, course curricula, literature digests, and concept synthesis"
    boundaries:
      - "Academic and study materials only; separate from personal life notes and raw research."

  personal:
    name: "Personal Space"
    path: "/Users/tai/personal-space"
    role: "Personal Life & Second Brain"
    description: "Personal life management, private knowledge vault, and personal routines."
    responsibilities:
      - "Private thoughts, daily journal, health, personal finance, private automation"
    boundaries:
      - "Strictly private; isolated from shared team, development, or scientific repositories."

# ------------------------------------------------------------------------------
# 2. INTERNAL TOOLING & PACKAGING CONTRACT
# ------------------------------------------------------------------------------
tooling_contract:
  canonical_root: "/Users/tai/development-space/tools"
  worktree_root: "/Users/tai/development-space/worktrees"
  binary_distribution_dir: "/Users/tai/.local/bin"
  driving_triad:
    superpowers:
      purpose: "Methodology engine (Plan -> TDD -> Debug -> Gate)"
    codebase_design:
      purpose: "Structural engine (Deep modules, minimal public interfaces)"
    xerj:
      purpose: "Code retrieval engine (AST, passage search, token efficiency)"
  distribution_rule: "Consumer spaces call tools exclusively via CLI binaries installed in ~/.local/bin."

# ------------------------------------------------------------------------------
# 3. GLOBAL PLATFORM AUTOMATIONS (macOS LaunchAgents)
# ------------------------------------------------------------------------------
global_automations:
  update_plugins_mcp_skills:
    label: "com.tai.update-plugins-mcp-skills"
    schedule: "03:00 daily"
    source: "/Users/tai/.agents/automation/update_plugins-mcp-skills"
    report_root: "/Users/tai/.agents/automation/update_plugins-mcp-skills/logs"
    plist: "~/Library/LaunchAgents/com.tai.update-plugins-mcp-skills.plist"
    purpose: "Maintains global Superpowers, Caveman hooks, npx skills, and mirrors."

  bridge_sync:
    label: "com.tai.bridge.sync"
    schedule: "04:00 daily"
    source: "/Users/tai/.agents/automation/bridge"
    purpose: "Synchronizes cross-space bridge assets, GitHub, and Google Drive metadata."

  model_control:
    label: "com.tai.model-control-sync"
    source: "/Users/tai/.agents/automation/model-control"
    purpose: "Evaluates and aligns available AI models across agent platforms."
