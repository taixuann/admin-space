version: 1
settings:
  auto_refresh_seconds: 30
  github_owner: taixuann

workspaces:
  - id: research-projects
    name: Research Projects
    category: Scientific Research
    path: /Users/tai/research-projects
    remote_repo: taixuann/research-projects
    default_branch: main
    tracked: true

  - id: agent-skills
    name: Agent Skills
    category: Agent Infrastructure
    path: /Users/tai/.agents
    remote_repo: taixuann/agent-skills
    default_branch: master
    tracked: true

  - id: agent-development
    name: Agent Development
    category: Agent Infrastructure
    path: /Users/tai/agent-development
    remote_repo: taixuann/agent-development
    default_branch: master
    tracked: true

  - id: raw-viewer
    name: Raw Viewer
    category: Scientific Tools
    path: /Users/tai/research-projects/tools/raw-viewer
    remote_repo: taixuann/raw-viewer
    default_branch: master
    tracked: true

  - id: personal-hub
    name: Personal Hub
    category: Personal & LifeOS
    path: /Users/tai/personal-space
    remote_repo: taixuann/non-research-projects
    default_branch: main
    tracked: false

  - id: learn-wiki
    name: Learn / Wiki
    category: Digital Garden
    path: /Users/tai/learn
    remote_repo: taixuann/wiki
    default_branch: main
    tracked: false
    pull_enabled: true

  - id: academic-portfolio
    name: Academic Portfolio
    category: Academic & Portfolio
    path: /Users/tai/personal-space/professional/portfolio/site
    remote_repo: taixuann/academic-portfolio
    default_branch: main
    tracked: true
