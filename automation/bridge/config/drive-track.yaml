version: 1
settings:
  remote_prefix: "gdrive:"

profiles:
  - id: personal-space-sync
    name: Personal Space
    category: Personal & LifeOS
    source_path: /Users/tai/personal-space
    remote_target: gdrive:personal-space/
    include_folders: "*"
    exclude_patterns: ".git, .venv, .pytest_cache, .DS_Store, node_modules, .obsidian/workspace*"
    enabled: true
    last_synced: null

  - id: research-space-sync
    name: Research Space (Full)
    category: Scientific Research
    source_path: /Users/tai/academic-space/research-space
    remote_target: gdrive:research/projects/
    include_folders: "*"
    exclude_patterns: ".git, .venv, venv, .build, .pytest_cache, .ruff_cache, .DS_Store, __pycache__, node_modules, worktree, worktrees"
    timeout: 7200
    enabled: false
    last_synced: null

  - id: learn-sync
    name: Knowledge Space / Wiki
    category: Digital Garden
    source_path: /Users/tai/academic-space/knowledge-space
    remote_target: gdrive:learn/
    include_folders: "*"
    exclude_patterns: ".git, .venv, .pytest_cache, .DS_Store, node_modules, .obsidian/workspace*"
    enabled: false
    last_synced: null
